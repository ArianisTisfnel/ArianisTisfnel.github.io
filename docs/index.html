<h1>Limanie</h1>
<p>Limanie 是一款個人生活流程管理的桌面應用程式，用來記錄時間、任務、日記與知識。目前由開發者一人自用，尚未對外發行。</p>
<h2>與 Google 帳號的關係</h2>
<p>Limanie 提供選用的「雲端備份」功能：使用者登入自己的 Google 帳號後，應用程式會把備份檔存到該帳號 Google 雲端硬碟中、只有這個應用程式看得到的專屬資料夾。除此之外，應用程式不讀取雲端硬碟裡的其他檔案。</p>
<p>詳見 <a href="privacy.html">隱私權政策</a>。</p>
